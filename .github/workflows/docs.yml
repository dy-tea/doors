name: Check Docs

on:
  push:
    paths:
      - "docs/*"
      - "src/ipc/cmd/*"
      - "tests/test_docs_usage.c"
  pull_request:
    paths:
      - "docs/*"
      - "src/ipc/cmd/*"
      - "tests/test_docs_usage.c"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install perl
        run: sudo apt install perl
      - name:	Run podchecker
        run: podchecker docs/*
